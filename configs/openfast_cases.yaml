# OpenFAST case generation (auxiliary; scripts/simulation/openfast_cases.py). Edit the executable path.
# The time-domain outputs used in the paper were written at DT_Out = 0.05 s (20 Hz); the analysis expects this.
openfast_exe: C:/Simulations/openfast_x64.exe
nonlinear_template_dir: openfast/templates/nonlinear
linear_template_dir: openfast/templates/linear
main_file: main.fst
nonlinear_output_dir: outputs/parametric
linear_output_dir: outputs_lin/parametric
csv_output_dir: data/openfast
n_cores: 4
tower_gauge_nodes: [1, 3, 5, 7, 10, 13, 15, 17, 20]
base:
  TMax: 3600
  DT: 0.0125
  DT_Out: 0.05
rotor:
  rpm: 12
  pitch_deg: 0
wave_cases:
  - {case: 1, Hs: 1.0, Tp: 6.0,  WaveDir: 0}
  - {case: 2, Hs: 1.0, Tp: 9.0,  WaveDir: 45}
  - {case: 3, Hs: 1.0, Tp: 12.0, WaveDir: 90}
  - {case: 4, Hs: 2.0, Tp: 8.0,  WaveDir: 0}
  - {case: 5, Hs: 2.0, Tp: 10.0, WaveDir: 45}
  - {case: 6, Hs: 2.0, Tp: 14.0, WaveDir: 90}
  - {case: 7, Hs: 3.0, Tp: 10.0, WaveDir: 0}
  - {case: 8, Hs: 3.0, Tp: 12.0, WaveDir: 45}
  - {case: 9, Hs: 3.0, Tp: 16.0, WaveDir: 90}
  - {case: 10, Hs: 4.0, Tp: 9.0, WaveDir: 0}
  - {case: 11, Hs: 4.0, Tp: 12.0, WaveDir: 45}
  - {case: 12, Hs: 4.0, Tp: 20.0, WaveDir: 90}
# Linearisation case. The generated .lin file is authoritative for the operating point used in Table 3.
# The source deck historically referenced a file named Steady12mps.dat, but the generated .lin/.out show 8 m/s.
linear_base: {TMax: 100, DT: 0.0125, DT_Out: 0.05, Linearize: true, CalcSteady: true, TrimCase: 3,
              NLinTimes: 36, CompSub: 1, CompMooring: 1}
linear_inflow: {HWindSpeed: 8.0}
linear_hydro: {WaveMod: 0}             # still water
linear_rotor: {rpm: 12, pitch_deg: 17.1}  # initial conditions; not the linearisation operating point
linear_reference:
  time_s: 100
  wind_speed_mps: 8.0
  rotor_speed_rpm: 0.1801              # nearly stationary at the linearisation instant
  mooring: MAP++
  subdyn_enabled: true                 # CompSub = 1
  still_water: true
  solver_dt_s: 0.0125
  output_dt_s: 0.05
  n_linearisation_positions: 36
